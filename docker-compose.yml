services:
  espnplus-epg:
    build: .
    container_name: espnplus-epg
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./output:/app/output
      - ./cache:/app/cache
      - ./logs:/app/logs
    environment:
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
